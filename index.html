<meta charset="utf-8">
<title>Dunstan Kitchen</title>
<meta name="theme-color" content="#F6F3F1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap">
<style id="app-css">
:root{
  --ground:#F6F3F1;--surface:#FFFFFF;--surface-2:#EFEAE7;--overlay:rgba(38,33,42,.45);
  --ink:#26212A;--ink-2:#6B6169;--ink-3:#766C74;--line:#D6CFCB;--line-2:#C6BDB8;
  --accent:#6E2F52;--accent-ink:#52223D;--accent-soft:#F3E6EE;--on-accent:#FFFFFF;
  --olive:#4F6B3A;--clay:#A85B32;--clay-soft:#F7EBE2;--alert:#9E2B25;--alert-soft:#F8E5E3;
  --shadow:0 1px 2px rgba(38,33,42,.05),0 10px 30px -14px rgba(38,33,42,.22);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#17141A;--surface:#211C26;--surface-2:#2C2633;--overlay:rgba(0,0,0,.62);
  --ink:#F2EDF0;--ink-2:#B7AEB9;--ink-3:#8E8494;--line:#352E3C;--line-2:#4A4152;
  --accent:#E093B8;--accent-ink:#F0B9D3;--accent-soft:#33202C;--on-accent:#1B0E16;
  --olive:#9CC27E;--clay:#E0A06A;--clay-soft:#2E2419;--alert:#F09189;--alert-soft:#3B1E1D;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7);
}}
:root[data-theme="dark"]{
  --ground:#17141A;--surface:#211C26;--surface-2:#2C2633;--overlay:rgba(0,0,0,.62);
  --ink:#F2EDF0;--ink-2:#B7AEB9;--ink-3:#8E8494;--line:#352E3C;--line-2:#4A4152;
  --accent:#E093B8;--accent-ink:#F0B9D3;--accent-soft:#33202C;--on-accent:#1B0E16;
  --olive:#9CC27E;--clay:#E0A06A;--clay-soft:#2E2419;--alert:#F09189;--alert-soft:#3B1E1D;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ground);color:var(--ink);
  font-family:"Familjen Grotesk","Helvetica Neue",Arial,sans-serif;font-size:16px;line-height:1.45;
  -webkit-font-smoothing:antialiased;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
.wrap{max-width:520px;margin:0 auto;padding:0 16px}
header{position:sticky;top:0;z-index:20;background:var(--ground);border-bottom:1px solid var(--line);
  padding:calc(10px + env(safe-area-inset-top)) 0 9px;margin-bottom:12px}
.brand{display:flex;align-items:center;gap:10px}
.brand h1{font-family:"Instrument Serif",Georgia,serif;font-weight:400;font-size:23px;margin:0;
  letter-spacing:0;flex:1;line-height:1.1}
.status{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);
  white-space:nowrap;display:flex;align-items:center;gap:5px}
.status .dot{width:7px;height:7px;border-radius:50%;background:var(--ink-3)}
.status[data-s="saved"]{color:var(--olive)} .status[data-s="saved"] .dot{background:var(--olive)}
.status[data-s="saving"]{color:var(--clay)} .status[data-s="saving"] .dot{background:var(--clay)}
.status[data-s="ro"]{color:var(--clay)} .status[data-s="ro"] .dot{background:var(--clay)}
.status[data-s="err"]{color:var(--alert)} .status[data-s="err"] .dot{background:var(--alert)}
.iconbtn{width:44px;height:44px;flex:none;display:grid;place-items:center;background:none;border:0;
  border-radius:12px;color:var(--ink-2);cursor:pointer;font-family:inherit}
.iconbtn:hover{background:var(--surface-2)}
.iconbtn svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);
  margin:22px 0 7px;display:flex;align-items:baseline;gap:8px}
.eyebrow .n{font-weight:600;letter-spacing:.04em;color:var(--ink-3);text-transform:none;font-size:11.5px}
.rowbtn{display:flex;align-items:center;gap:12px;width:100%;min-height:64px;padding:9px 12px;
  background:var(--surface);border:1px solid var(--line);border-radius:16px;margin-bottom:8px;cursor:pointer;
  text-align:left;font-family:inherit;font-size:15px;color:var(--ink);box-shadow:var(--shadow)}
.rowbtn:hover{border-color:var(--line-2)}
.rowbtn .grow{flex:1;min-width:0}
.rowbtn .t{display:block;font-weight:500;line-height:1.3}
.rowbtn .s{display:block;font-size:12.5px;color:var(--ink-3);margin-top:2px}
.rowbtn .s.empty{color:var(--accent);font-weight:600}
.rowbtn .star{flex:none;color:var(--clay);font-size:15px;line-height:1}
.when{width:42px;flex:none;font-size:11px;color:var(--ink-3);font-weight:700;line-height:1.2;
  text-transform:uppercase;letter-spacing:.06em}
.when i{display:block;font-style:normal;font-size:19px;color:var(--ink);font-variant-numeric:tabular-nums;
  font-weight:500;letter-spacing:0}
.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),var(--shadow)}
.today .when i,.today .when{color:var(--accent)}
.lo{background:var(--clay-soft);border-color:var(--line)}
.th{width:52px;height:52px;flex:none;border-radius:13px;overflow:hidden;display:block;position:relative}
.th svg,.th img{width:100%;height:100%;display:block;object-fit:cover}
.banner{width:100%;height:172px;border-radius:18px;overflow:hidden;display:block;margin-bottom:14px;position:relative}
.banner svg,.banner img{width:100%;height:100%;display:block;object-fit:cover}
.chip{flex:none;border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2);border-radius:999px;
  min-height:44px;padding:0 15px;font-size:13.5px;font-weight:600;cursor:pointer;white-space:nowrap;font-family:inherit}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 0 6px;margin-bottom:8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.tagpill{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 7px;
  border-radius:6px;background:var(--surface-2);color:var(--ink-2);flex:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:48px;padding:0 16px;
  border-radius:13px;background:var(--accent);color:var(--on-accent);font-weight:600;font-size:15px;
  text-decoration:none;border:0;cursor:pointer;font-family:inherit;width:100%;text-align:center}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line-2)}
.btn.danger{background:var(--alert-soft);color:var(--alert)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btnrow{display:flex;gap:9px;margin-top:11px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:11px}
input,select,textarea{width:100%;font-family:inherit;font-size:16px;color:var(--ink);background:var(--surface);
  border:1px solid var(--line-2);border-radius:12px;padding:12px 13px;min-height:48px}
textarea{min-height:110px;resize:vertical;line-height:1.5}
label{display:block;font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink-3);margin:16px 0 6px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.scrim{position:fixed;inset:0;background:var(--overlay);z-index:40;display:none}
.scrim.open{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--surface);border-radius:24px 24px 0 0;
  max-height:92vh;display:none;flex-direction:column;box-shadow:0 -10px 40px -14px rgba(0,0,0,.45)}
.sheet.open{display:flex}
.sheet .head{display:flex;align-items:center;gap:10px;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.sheet .head h3{font-family:"Instrument Serif",Georgia,serif;font-size:21px;font-weight:400;margin:0;flex:1;line-height:1.2}
.sheet .body{overflow-y:auto;padding:14px 16px calc(26px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
.x{background:none;border:0;width:44px;height:44px;flex:none;font-size:27px;line-height:1;color:var(--ink-3);
  cursor:pointer;font-family:inherit;border-radius:12px}
.ilist{list-style:none;margin:6px 0 0;padding:0}
.ilist li{display:flex;gap:11px;align-items:baseline;padding:8px 0;border-top:1px solid var(--line);font-size:15px}
.ilist li:first-child{border-top:0}
.ilist .q{font-variant-numeric:tabular-nums;color:var(--ink-2);min-width:80px;flex:none;font-weight:600}
.ilist li.st .n{color:var(--ink-3)}
.box{width:26px;height:26px;flex:none;border-radius:8px;border:2px solid var(--line-2);display:grid;place-items:center}
.rowbtn[aria-pressed="true"] .box{background:var(--accent);border-color:var(--accent)}
.rowbtn[aria-pressed="true"] .t{text-decoration:line-through;color:var(--ink-3)}
.box svg{opacity:0;width:14px;height:14px}
.box.part{border-color:var(--clay);position:relative}
.box.part:after{content:"";position:absolute;width:12px;height:3px;border-radius:2px;background:var(--clay)}
.rowbtn .box.part+.grow .s{color:var(--clay);font-weight:600}
.snackrow{background:var(--accent-soft);border-color:var(--line);min-height:56px}
.snackrow .th{width:44px;height:44px;border-radius:11px}
.snackrow .s{color:var(--accent-ink)}
.rowbtn[aria-pressed="true"] .box svg{opacity:1}
.rm{margin-left:auto;background:none;border:0;color:var(--ink-3);cursor:pointer;font-size:21px;line-height:1;
  width:44px;height:44px;font-family:inherit}
nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom)}
nav .wrap{display:flex;padding:0}
.tab{flex:1;min-height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  background:none;border:0;cursor:pointer;font-family:inherit;font-size:11px;font-weight:600;color:var(--ink-3)}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-selected="true"]{color:var(--accent)}
.empty{color:var(--ink-3);font-size:14.5px;padding:26px 12px;text-align:center;line-height:1.55}
.sub{font-size:13.5px;color:var(--ink-2);margin:0 0 12px;line-height:1.5}
.weekhead{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin:20px 0 8px}
.note{background:var(--clay-soft);color:var(--clay);border-radius:11px;padding:11px 13px;font-size:13.5px;
  margin-bottom:12px;line-height:1.45}
.kv{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 12px}
.kv span{font-size:12.5px;color:var(--ink-2);background:var(--surface-2);border-radius:8px;padding:5px 9px;font-weight:500}
.stars{display:flex;gap:2px}
.stars button{width:44px;height:44px;background:none;border:0;cursor:pointer;font-size:23px;line-height:1;
  color:var(--line-2);font-family:inherit;padding:0}
.stars button.on{color:var(--clay)}
.step{display:flex;align-items:center;gap:0;border:1px solid var(--line-2);border-radius:12px;overflow:hidden;
  background:var(--surface);width:max-content}
.step button{width:46px;height:46px;background:none;border:0;font-size:20px;color:var(--ink);cursor:pointer;font-family:inherit}
.step b{min-width:56px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:no-preference){.rowbtn,.chip,.tab,.iconbtn{transition:background-color .13s,border-color .13s,color .13s}}
/* ---- tablet: side rail + two columns ---- */
@media (min-width:820px){
  body{padding-bottom:0;padding-left:212px}
  .wrap{max-width:860px;padding:0 28px}
  header{padding-top:18px}
  nav{left:0;right:auto;top:0;bottom:0;width:212px;border-top:0;border-right:1px solid var(--line);
    background:var(--surface);padding:calc(20px + env(safe-area-inset-top)) 12px 0}
  nav .wrap{display:block;max-width:none;padding:0}
  nav:before{content:"";display:block;height:8px}
  .tab{flex-direction:row;justify-content:flex-start;gap:12px;width:100%;min-height:50px;padding:0 12px;
    border-radius:12px;font-size:15px;font-weight:500;margin-bottom:4px}
  .tab[aria-selected="true"]{background:var(--accent-soft);color:var(--accent-ink)}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
  .cols>.weekhead,.cols>.eyebrow,.cols>.btnrow,.cols>.chips,.cols>.sub,.cols>.empty{grid-column:1/-1}
  .sheet{left:50%;right:auto;bottom:auto;top:50%;transform:translate(-50%,-50%);width:min(560px,92vw);
    border-radius:22px;max-height:86vh}
  .banner{height:220px}
}
</style>

function artSVG(r){

function artFor(name,tag){
  var low=String(name||"").toLowerCase();
  for(var i=0;i<RULES.length;i++){ var k=RULES[i][0], w=RULES[i][1];
    for(var j=0;j<w.length;j++){ if(low.indexOf(w[j])>-1) return k } }
  if(tag==="Takeaway") return "takeaway";

  if(/chicken|pork|beef|lamb|turkey/.test(low)) return "roast";

/* ---------- saving ---------- */
function setStatus(s,t){ var el=$("#status"); if(!el)return; el.dataset.s=s; $("#statusText").textContent=t }
function queueSave(){ if(!canWrite){setStatus("ro","View only");return}
  dirty=true; setStatus("saving","Saving"); clearTimeout(saveTimer); saveTimer=setTimeout(function(){doSave()},900) }
async function doSave(extra){
  if(standalone){
    try{ lsSet("dk_state",STATE); dirty=false; setStatus("saved","On this device") }
    catch(e){ setStatus("err","Storage full") }
    return;
  }
  if(!API||!canWrite) return;
  var payload=JSON.stringify(STATE);
  if(filesOk){
    var files={"data/state.json":{content:payload,contentType:"application/json"}};
    if(extra) for(var k in extra) files[k]=extra[k];
    try{ await API.publish(files); dirty=false; setStatus("saved","Saved"); return }
    catch(e){
      var c=(e&&e.code)||"upstream_error";
      if(c==="conflict"){ setStatus("saving","Reloading"); return }
      if(c==="not_writer"||c==="not_granted"||c==="not_declared"){ canWrite=false; setStatus("ro","View only"); render(); return }
      if(c==="rate_limited"){ clearTimeout(saveTimer); saveTimer=setTimeout(function(){doSave()},4000); return }
      if(c==="too_large"){ setStatus("err","Photo too big"); return }
      filesOk=false;
    }
  }
  try{ await API.publish(TEMPLATE.replace("__STATE__", payload.replace(/<\//g,"<\\/"))); dirty=false; setStatus("saved","Saved") }
  catch(e2){ var c2=(e2&&e2.code)||"";
    if(c2==="conflict"){ setStatus("saving","Reloading"); return }
    if(c2==="not_writer"||c2==="not_granted"){ canWrite=false; setStatus("ro","View only"); render(); return }
    setStatus("err","Not saved") }
}
function mutate(fn){ fn(); render(); queueSave() }

/* ---------- photos ---------- */
function shrink(file,max,q){
  return new Promise(function(res,rej){
    var img=new Image(), url=URL.createObjectURL(file);
    img.onload=function(){
      var w=img.width,h=img.height,s=Math.min(1,max/Math.max(w,h));
      var c=document.createElement("canvas"); c.width=Math.round(w*s)||1; c.height=Math.round(h*s)||1;
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      c.toBlob(function(b){ URL.revokeObjectURL(url); b?res(b):rej({code:"encode"}) },"image/jpeg",q);
    };
    img.onerror=function(){ URL.revokeObjectURL(url); rej({code:"read"}) };
    img.src=url;
  });
}
let photoTarget=null, photoAfter=null;
$("#photoInput").addEventListener("change", async function(e){
  var f=e.target.files&&e.target.files[0]; e.target.value="";
  if(!f||!photoTarget) return;
  var target=photoTarget, after=photoAfter; photoAfter=null;
  setStatus("saving","Saving photo");
  try{
    var blob=await shrink(f,900,.72);
    if(after){ /* new-recipe form: hold it as a data URL until the recipe is saved */
      var fr0=new FileReader();
      var durl=await new Promise(function(res,rej){ fr0.onload=function(){res(fr0.result)}; fr0.onerror=rej; fr0.readAsDataURL(blob) });
      after(durl,blob); setStatus(canWrite?"saved":"ro",canWrite?(standalone?"On this device":"Saved"):"View only"); return;
    }
    var r=byId(target); if(!r) return;
    if(standalone){
      var fr=new FileReader();
      r.photo=await new Promise(function(res,rej){ fr.onload=function(){res(fr.result)}; fr.onerror=rej; fr.readAsDataURL(blob) });
      render(); openRecipe(r.id); await doSave(); return;
    }
    var path="photos/"+r.id+"-"+Date.now().toString(36)+".jpg";
    PHOTOURL[r.id]=URL.createObjectURL(blob);
    r.photo=path;
    render(); openRecipe(r.id);
    var files={}; files[path]=blob;
    await doSave(files);
  }catch(err){ setStatus("err","Photo failed") }
});

/* ---------- ingredients ---------- */
const UNITS="kg|g|ml|l|tbsp|tbs|tsp|cups?|cloves?|cans?|tins?|bunch(?:es)?|pinch(?:es)?|sprigs?|rashers?|slices?|packs?|punnets?|each|x";
function isStaple(n){ return STAPLES.indexOf(String(n||"").toLowerCase())>-1 }
function parseIng(text){
  return text.split(/\n/).map(function(l){return l.trim()}).filter(Boolean).map(function(line){
    var m=line.match(new RegExp("^(\\d+(?:[.,]\\d+)?|\\d+\\/\\d+)?\\s*("+UNITS+")?\\b\\s*(?:of\\s+)?(.+)$","i"));
    var q=null,u="",n=line;
    if(m){ if(m[1]){ var s=m[1].replace(",",".");
        q=s.indexOf("/")>-1?(function(){var p=s.split("/");return Math.round(p[0]/p[1]*100)/100})():parseFloat(s) }
      u=(m[2]||"").toLowerCase(); n=(m[3]||line).trim() }
    if(u==="tbs")u="tbsp"; if(u==="l")u="L"; if(u==="ml")u="mL";
    n=n.replace(/^[,\-\s]+/,"").replace(/\s+/g," ");
    return {n:n,q:q,u:u,a:AISLES[n.toLowerCase()]||"Other",st:isStaple(n)};
  });
}
function fmtQ(q,u){
  if(q==null||q==="") return u||"";
  if(u==="g"&&q>=1000) return (Math.round(q/100)/10)+" kg";
  if(u==="mL"&&q>=1000) return (Math.round(q/100)/10)+" L";
  return (Math.round(q*100)/100)+(u?" "+u:"");
}

  if(ui.range==="week"){ return [TODAY, addDays(monday,6)] }
  if(ui.range==="nextweek"){ var s=addDays(monday,7); return [s, addDays(s,6)] }
  if(ui.range==="month"){ return [TODAY, iso(new Date(t.getFullYear(),t.getMonth()+1,0))] }

/* ---------- CSV ---------- */
function q(v){ var s=(v==null?"":String(v)); return /[",\n]/.test(s)?'"'+s.split('"').join('""')+'"':s }
function buildCSV(){
  var L=[];
  L.push(["DUNSTAN KITCHEN","v4",TODAY].map(q).join(","));
  L.push("");
  L.push("RECIPES");
  L.push("id,name,type,serves,protein,link,notes,favourite,rating,times_cooked,last_cooked,picture,photo,sweet");
  STATE.recipes.forEach(function(r){
    L.push([r.id,r.name,r.tag,r.serves,r.prot==null?"":r.prot,r.url,r.notes,r.fav?"yes":"",
            r.rate||"",r.cook||"",r.last||"",r.art||"",r.photo||"",
            r.tag==="Snack"?(r.sw?"sweet":"savoury"):""].map(q).join(","));
  });
  L.push("");
  L.push("INGREDIENTS");
  L.push("recipe_id,recipe,ingredient,qty,unit,aisle,staple");
  STATE.recipes.forEach(function(r){ r.ing.forEach(function(i){
    L.push([r.id,r.name,i.n,i.q==null?"":i.q,i.u||"",i.a||"",i.st?"yes":""].map(q).join(","));
  })});
  L.push("");
  L.push("PLAN");
  L.push("date,day,recipe_id,recipe,serves,leftovers,cooked,note");
  Object.keys(STATE.plan).sort().forEach(function(d){
    var r=byId(STATE.plan[d]), n=night(d)||{};
    L.push([d,FULLDOW[parseD(d).getDay()],STATE.plan[d],r?r.name:"",servesFor(d,r),
            n.lo?"yes":"",n.done?"yes":"",n.note||""].map(q).join(","));
  });
  L.push("");
  L.push("SNACKS");
  L.push("prep_date,recipe_id,recipe,kind");
  Object.keys(STATE.snacks||{}).sort().forEach(function(d){
    var r=byId(STATE.snacks[d]);
    L.push([d,STATE.snacks[d],r?r.name:"",r?(r.sw?"sweet":"savoury"):""].map(q).join(","));
  });
  L.push("");
  L.push("BOUGHT");
  L.push("ingredient_key,week_starting");
  Object.keys(STATE.got||{}).sort().forEach(function(k){
    var at=k.lastIndexOf("@");
    L.push([k.slice(0,at),k.slice(at+1)].map(q).join(","));
  });
  L.push("");
  L.push("EXTRAS");
  L.push("item,done");
  STATE.extras.forEach(function(x){ L.push([x.n,x.done?"yes":""].map(q).join(",")) });
  return L.join("\n");
}
function parseCSV(text){
  var rows=[],row=[],cell="",i=0,inq=false,c;
  text=text.replace(/\r\n/g,"\n").replace(/\r/g,"\n");
  for(;i<text.length;i++){ c=text[i];
    if(inq){ if(c==='"'){ if(text[i+1]==='"'){cell+='"';i++} else inq=false } else cell+=c }
    else if(c==='"') inq=true;
    else if(c===","){ row.push(cell); cell="" }
    else if(c==="\n"){ row.push(cell); rows.push(row); row=[]; cell="" }
    else cell+=c;
  }
  row.push(cell); rows.push(row);
  return rows;
}
function importCSV(text){
  var rows=parseCSV(text), sec="", head=null, recs=[], byid={}, plan={}, nights={}, extras=[], ings={},
      snacks={}, got={};
  rows.forEach(function(r){
    var first=(r[0]||"").trim();
    if(!first&&r.length<=1) return;
    if(["RECIPES","INGREDIENTS","PLAN","SNACKS","BOUGHT","EXTRAS"].indexOf(first)>-1 && !(r[1]||"").trim()){ sec=first; head=null; return }
    if(first==="DUNSTAN KITCHEN") return;
    if(!sec) return;
    if(!head){ head=r.map(function(x){return x.trim().toLowerCase()}); return }
    var o={}; head.forEach(function(k,ix){ o[k]=(r[ix]==null?"":r[ix]).trim() });
    if(sec==="RECIPES"&&o.id&&o.name){
      var rec={id:o.id,name:o.name,tag:o.type||"Other",serves:+o.serves||4,
        prot:o.protein?+o.protein:null,url:o.link||"",notes:o.notes||"",
        fav:/^y/i.test(o.favourite||""),rate:+o.rating||0,cook:+o.times_cooked||0,
        last:o.last_cooked||null,art:o.picture||"pot",photo:o.photo||null,ing:[],
        sw:/sweet/i.test(o.sweet||"")};
      recs.push(rec); byid[rec.id]=rec;
    }
    if(sec==="INGREDIENTS"&&o.recipe_id&&o.ingredient){
      (ings[o.recipe_id]=ings[o.recipe_id]||[]).push({n:o.ingredient,
        q:o.qty===""?null:+o.qty,u:o.unit||"",a:o.aisle||AISLES[o.ingredient.toLowerCase()]||"Other",
        st:/^y/i.test(o.staple||"")});
    }
    if(sec==="PLAN"&&o.date&&o.recipe_id){
      plan[o.date]=o.recipe_id;
      var n={};
      if(o.serves) n.s=+o.serves;
      if(/^y/i.test(o.leftovers||"")) n.lo=1;
      if(/^y/i.test(o.cooked||"")) n.done=1;
      if(o.note) n.note=o.note;
      if(Object.keys(n).length) nights[o.date]=n;
    }
    if(sec==="SNACKS"&&o.prep_date&&o.recipe_id) snacks[o.prep_date]=o.recipe_id;
    if(sec==="BOUGHT"&&o.ingredient_key&&o.week_starting) got[o.ingredient_key+"@"+o.week_starting]=1;
    if(sec==="EXTRAS"&&o.item) extras.push({id:uid("x"),n:o.item,done:/^y/i.test(o.done||"")});
  });
  Object.keys(ings).forEach(function(k){ if(byid[k]) byid[k].ing=ings[k] });
  if(!recs.length) throw new Error("no recipes found");
  Object.keys(plan).forEach(function(d){ if(!byid[plan[d]]) delete plan[d] });
  Object.keys(nights).forEach(function(d){ var n=nights[d], r=byid[plan[d]];
    if(r&&n.s===r.serves) delete n.s;
    if(!Object.keys(n).length) delete nights[d] });
  Object.keys(snacks).forEach(function(d){ if(!byid[snacks[d]]) delete snacks[d] });
  return {v:1,seedv:STATE.seedv,recipes:recs,plan:plan,nights:nights,extras:extras,snacks:snacks,got:got};
}

    mutate(function(){var r=byId(i0); if(r) r.fav=!r.fav}); openRecipe(i0); return}
  var sr=e.target.closest("[data-star]"); if(sr){var grp=sr.closest("[data-rate]"); if(grp){var i7=grp.dataset.rate,v=+sr.dataset.star;
    mutate(function(){var r=byId(i7); if(r) r.rate=(r.rate===v?0:v)}); openRecipe(i7); return}}
  var xd=e.target.closest("[data-xdel]"); if(xd){e.stopPropagation();var i1=xd.dataset.xdel;
    mutate(function(){STATE.extras=STATE.extras.filter(function(x){return x.id!==i1})});return}
  var xt=e.target.closest("[data-xtick]"); if(xt){var i2=xt.dataset.xtick;
    mutate(function(){var x=STATE.extras.find(function(y){return y.id===i2}); if(x)x.done=!x.done});return}
  var tk=e.target.closest("[data-tick]"); if(tk){
    var gk=tk.dataset.tick, ws=(tk.dataset.weeks||"").split(",").filter(Boolean);
    var all=ws.length>0&&ws.every(function(m){return isGot(gk,m)});
    mutate(function(){ ws.forEach(function(m){ setGot(gk,m,!all) }) }); return}
  if(e.target.id==="clearTicks"){
    var R2=rangeDates(), lo=weekMon(R2[0]), hi=weekMon(R2[1]);
    mutate(function(){ Object.keys(STATE.got||{}).forEach(function(kk){
      var m=kk.slice(kk.lastIndexOf("@")+1); if(m>=lo&&m<=hi) delete STATE.got[kk] }) });
    if($("#sheet").classList.contains("open")) closeSheet(); return}
  if(e.target.id==="xadd"){var v1=((($("#xnew")||{}).value)||"").trim(); if(!v1)return;
    mutate(function(){STATE.extras.push({id:uid("x"),n:v1,done:false})});return}
  /* nights */
  var sv=e.target.closest("[data-serv]"); if(sv){var pr=sv.dataset.serv.split("|"),d0=pr[0],dl=+pr[1];
    var r0=byId(STATE.plan[d0]); if(!r0) return;
    mutate(function(){ var cur=servesFor(d0,r0), nv=Math.max(1,Math.min(30,cur+dl));
      setNight(d0,function(n){ if(nv===r0.serves) delete n.s; else n.s=nv }) });
    openSheet(FULLDOW[parseD(d0).getDay()]+" "+pretty(d0), nightSheet(d0)); return}
  var ck=e.target.closest("[data-cooked]"); if(ck){var d5=ck.dataset.cooked, r5=byId(STATE.plan[d5]);
    mutate(function(){ var was=(night(d5)||{}).done;
      setNight(d5,function(n){ if(was) delete n.done; else n.done=1 });
      if(r5){ if(was){ r5.cook=Math.max(0,(r5.cook||0)-1);
          if(r5.last===d5){ var mx=null; Object.keys(STATE.nights||{}).forEach(function(k){
            if((STATE.nights[k]||{}).done && STATE.plan[k]===r5.id && (!mx||k>mx)) mx=k });
            r5.last=mx } }
        else { r5.cook=(r5.cook||0)+1; if(!r5.last||r5.last<d5) r5.last=d5 } } });
    openSheet(FULLDOW[parseD(d5).getDay()]+" "+pretty(d5), nightSheet(d5)); return}
  var tw=e.target.closest("[data-twice]"); if(tw){var d6=tw.dataset.twice;
    openSheet("Who eats the leftovers?", loPickHTML(d6)); return}
  var ln=e.target.closest("[data-lonight]"); if(ln){var to6=ln.dataset.lonight, fr6=ln.dataset.lofrom;
    var r6=byId(STATE.plan[fr6]); if(!r6) return;
    var base=servesFor(fr6,r6);
    mutate(function(){ setNight(fr6,function(n){ n.s=base*2 });
      STATE.plan[to6]=r6.id; setNight(to6,function(n){ n.lo=1; n.s=base; delete n.done }) });
    openSheet(FULLDOW[parseD(to6).getDay()]+" "+pretty(to6), nightSheet(to6)); return}
  var nt=e.target.closest("[data-note]"); if(nt){var d7=nt.dataset.note, n7=night(d7)||{};
    openSheet("A note for "+pretty(d7),
      '<label for="nnote">What should you remember?</label>'
      +'<textarea id="nnote" style="min-height:96px" placeholder="Take the mince out of the freezer">'+esc(n7.note||"")+'</textarea>'
      +'<div class="grid2"><button class="btn" data-nsave="'+d7+'">Save the note</button>'
      +'<button class="btn ghost" data-back="'+d7+'">Back</button></div>'); return}
  var ns=e.target.closest("[data-nsave]"); if(ns){var d8=ns.dataset.nsave, v8=(($("#nnote")||{}).value||"").trim();
    mutate(function(){ setNight(d8,function(n){ if(v8) n.note=v8; else delete n.note }) });
    openSheet(FULLDOW[parseD(d8).getDay()]+" "+pretty(d8), nightSheet(d8)); return}
  var bk=e.target.closest("[data-back]"); if(bk){var d9=bk.dataset.back;
    openSheet(FULLDOW[parseD(d9).getDay()]+" "+pretty(d9), nightSheet(d9)); return}
  var pl=e.target.closest("[data-planit]"); if(pl){var i6=pl.dataset.planit;
    openSheet("Which night?", planPickHTML(i6)); return}
  var pn=e.target.closest("[data-pnight]"); if(pn){var pd=pn.dataset.pnight, pr2=pn.dataset.prec;
    mutate(function(){ STATE.plan[pd]=pr2 }); closeSheet(); ui.tab="plan"; render(); return}
  /* plan + swapping */
  var tg=e.target.closest("[data-target]");
  if(tg){ var from=tg.dataset.from,to=tg.dataset.target,mode=tg.dataset.mode;
    mutate(function(){ var a=STATE.plan[from],b=STATE.plan[to],na=night(from),nb=night(to);
      if(mode==="swap"){ if(b!=null)STATE.plan[from]=b; else delete STATE.plan[from]; STATE.plan[to]=a;
        if(STATE.nights){ if(nb) STATE.nights[from]=nb; else delete STATE.nights[from];
          if(na) STATE.nights[to]=na; else delete STATE.nights[to] } }
      else { STATE.plan[to]=a; delete STATE.plan[from];
        if(STATE.nights){ if(na) STATE.nights[to]=na; delete STATE.nights[from] } } });
    closeSheet(); return }
  var sw=e.target.closest("[data-swap]"); if(sw){openSheet("Swap with…", dayListHTML(sw.dataset.swap,"swap"));return}
  var mv=e.target.closest("[data-move]"); if(mv){openSheet("Move to…", dayListHTML(mv.dataset.move,"move"));return}
  var ch=e.target.closest("[data-change]"); if(ch){var d1=ch.dataset.change;
    openSheet(FULLDOW[parseD(d1).getDay()]+" "+pretty(d1), pickerHTML(d1)); renderPicker(); return}
  var sh=e.target.closest("[data-shuffle]");
  if(sh){ var d2=sh.dataset.shuffle, cur2=byId(STATE.plan[d2]);
    var recent={}; for(var w=-6;w<=6;w++){ var dd2=addDays(d2,w); if(dd2!==d2&&STATE.plan[dd2]) recent[STATE.plan[dd2]]=1 }
    var pool=STATE.recipes.filter(function(r){return cur2&&r.tag===cur2.tag&&r.id!==cur2.id&&!recent[r.id]});
    if(!pool.length) pool=STATE.recipes.filter(function(r){return (!cur2||r.id!==cur2.id)&&!recent[r.id]});
    if(!pool.length) pool=STATE.recipes.filter(function(r){return !cur2||r.id!==cur2.id});
    var pickR=pool[Math.floor(Math.random()*pool.length)];
    mutate(function(){STATE.plan[d2]=pickR.id}); openSheet(FULLDOW[parseD(d2).getDay()]+" "+pretty(d2), nightSheet(d2)); return }
  var day=e.target.closest("[data-day]");
  if(day){ var dv=day.dataset.day;
    openSheet(FULLDOW[parseD(dv).getDay()]+" "+pretty(dv), nightSheet(dv));
    if(!STATE.plan[dv]) renderPicker();
    return }
  var pt=e.target.closest("[data-ptag]"); if(pt){ ui.ptag=pt.dataset.ptag;
    document.querySelectorAll("[data-ptag]").forEach(function(b){b.setAttribute("aria-pressed",String(b===pt))});
    renderPicker(); return }
  var pk=e.target.closest("[data-pick]");
  if(pk){ var rid=pk.dataset.pick, d3=ui.pday; mutate(function(){STATE.plan[d3]=rid}); closeSheet(); return }
  var cl=e.target.closest("[data-clear]"); if(cl){var d4=cl.dataset.clear;
    mutate(function(){delete STATE.plan[d4]; if(STATE.nights) delete STATE.nights[d4]}); closeSheet(); return}
  /* recipes */
  var op=e.target.closest("[data-open]"); if(op){openRecipe(op.dataset.open);return}
  var ed=e.target.closest("[data-edit]"); if(ed){openSheet("Edit recipe", recipeForm(byId(ed.dataset.edit)));return}
  if(e.target.id==="newRecipe"){openSheet("New recipe", recipeForm(null));return}
  if(e.target.closest("#fphoto")){ pickPhoto("new", function(durl,blob){
      formPhoto={durl:durl,blob:blob};
      var w=$("#fphotoWrap"); if(w) w.innerHTML='<span class="banner"><img src="'+esc(durl)+'" alt=""></span>';
      var b=$("#fphoto"); if(b) b.textContent="Change the photo";
    }); return }
  if(e.target.id==="fcancel"){closeSheet();return}
  var dl2=e.target.closest("[data-del]"); if(dl2){var i3=dl2.dataset.del;
    openSheet("Delete recipe",'<div class="empty">Delete this meal? Any night planned with it is cleared too.</div>'
      +'<div class="grid2"><button class="btn danger" data-delyes="'+i3+'">Delete</button>'
      +'<button class="btn ghost" id="fcancel">Keep it</button></div>');return}
  var dy=e.target.closest("[data-delyes]"); if(dy){var i4=dy.dataset.delyes;
    mutate(function(){ STATE.recipes=STATE.recipes.filter(function(x){return x.id!==i4});
      Object.keys(STATE.plan).forEach(function(k){if(STATE.plan[k]===i4){delete STATE.plan[k];
        if(STATE.nights) delete STATE.nights[k]}}) });
    closeSheet(); return}
  if(e.target.id==="fsave"){ saveRecipeForm(); return }
});
function loPickHTML(from){
  var r=byId(STATE.plan[from]);
  var out='<p class="sub">Cook double on '+pretty(from)+', then eat it again on the night you pick. That night gets nothing added to the shopping list.</p>';
  for(var i=1;i<=10;i++){ var d=addDays(from,i), o=STATE.plan[d]?byId(STATE.plan[d]):null, dd=parseD(d);
    out+='<button class="rowbtn" data-lonight="'+d+'" data-lofrom="'+from+'">'
      +'<span class="when">'+DOW[dd.getDay()]+'<i>'+dd.getDate()+'</i></span>'
      +'<span class="grow"><span class="t">'+(o?esc(o.name):"— empty")+'</span>'
      +'<span class="s">'+(o?"this meal is replaced":"free night")+'</span></span></button>' }
  return out;
}
function planPickHTML(id){
  var out='<p class="sub">Tap the night you want it on.</p>';
  for(var i=0;i<21;i++){ var d=addDays(TODAY,i), r=STATE.plan[d]?byId(STATE.plan[d]):null, dd=parseD(d);
    out+='<button class="rowbtn" data-pnight="'+d+'" data-prec="'+id+'">'
      +'<span class="when">'+DOW[dd.getDay()]+'<i>'+dd.getDate()+'</i></span>'
      +'<span class="grow"><span class="t">'+(r?esc(r.name):"— empty")+'</span></span></button>' }
  return out;
}
async function saveRecipeForm(){
  var name=($("#fname").value||"").trim(); if(!name){$("#fname").focus();return}
  var id5=$("#fid").value||uid("r");
  var old=byId(id5)||{};
  var tagv=$("#ftag").value;
  var art=(old.name&&old.name===name&&old.art)?old.art:artFor(name,tagv);
  var swEl=$("#fsweet");
  var sw = tagv==="Snack" ? (swEl?swEl.value==="sweet":!!old.sw) : false;
  var rec={id:id5,name:name,tag:$("#ftag").value,serves:+$("#fserves").value||4,
    url:($("#furl").value||"").trim(),notes:($("#fnotes").value||"").trim(),
    ing:parseIng($("#fing").value||""),prot:old.prot||null,photo:old.photo||null,
    art:art,fav:!!old.fav,rate:old.rate||0,cook:old.cook||0,last:old.last||null,sw:sw};
  var shot=formPhoto; formPhoto=null;
  var extra=null;
  if(shot){
    if(standalone) rec.photo=shot.durl;
    else { var path="photos/"+id5+"-"+Date.now().toString(36)+".jpg";
      rec.photo=path; PHOTOURL[id5]=shot.durl; extra={}; extra[path]=shot.blob }
  }
  var ix=STATE.recipes.findIndex(function(x){return x.id===id5});
  if(ix>-1)STATE.recipes[ix]=rec; else STATE.recipes.push(rec);
  closeSheet(); render();
  if(extra){ setStatus("saving","Saving"); await doSave(extra) } else queueSave();
}
document.addEventListener("input", function(e){
  if(e.target.id==="pq"){ renderPicker(); return }
  if(e.target.id==="rq"){ ui.rq=e.target.value; var p=e.target.selectionStart; render();
    var el=$("#rq"); if(el){el.focus(); try{el.setSelectionRange(p,p)}catch(x){}} }
});
document.addEventListener("keydown", function(e){ if(e.key==="Escape") closeSheet() });

/* ---------- boot ---------- */
function upgrade(j,SEED){
  if(!j.extras) j.extras=[];
  if(!j.nights) j.nights={};
  if(!j.got) j.got={};
  if(!j.snacks||!Object.keys(j.snacks).length) j.snacks=JSON.parse(JSON.stringify(SEED.snacks||{}));
  /* drop ticks for weeks that finished more than ten weeks ago */
  var cut=addDays(weekMon(TODAY),-70);
  Object.keys(j.got).forEach(function(k){ var m=k.slice(k.lastIndexOf("@")+1); if(m<cut) delete j.got[k] });
  j.recipes.forEach(function(r){ if(!r.art){ var s=SEED.recipes.find(function(x){return x.id===r.id});
      r.art=(s&&s.art)||artFor(r.name,r.tag) }
    if(r.fav==null) r.fav=false; if(r.rate==null) r.rate=0;
    if(r.cook==null) r.cook=0; if(r.last===undefined) r.last=null;
    if(r.tag==="Snack"&&r.sw==null){ var sd=SEED.recipes.find(function(x){return x.id===r.id});
      r.sw=sd?!!sd.sw:/sweet|choc|bliss|cookie|energy ball/i.test(r.name) }
    (r.ing||[]).forEach(function(i){ if(i.st==null) i.st=isStaple(i.n) }) });
  if(j.seedv!==SEED.seedv){
    var have={}; j.recipes.forEach(function(r){have[r.id]=1});
    SEED.recipes.forEach(function(r){ if(!have[r.id]) j.recipes.push(r) });
    j.seedv=SEED.seedv; return true;
  }
  return false;
}
const SEED=JSON.parse($("#seed").textContent);
applyTheme(); render(); setStatus("idle","Loading");
(async function(){
  var merged=false;
  try{
    var res=await fetch("data/state.json",{cache:"no-store"});
    if(res.ok){
      var j=await res.json();
      if(j&&j.v&&j.recipes){ merged=upgrade(j,SEED); STATE=j; render() }
    }
  }catch(e){}
  if(!window.claude||!window.claude.use){
    standalone=true; canWrite=true;
    var lj=lsGet("dk_state",null);
    if(lj&&lj.v&&lj.recipes){ upgrade(lj,SEED); STATE=lj }
    setStatus("saved","On this device"); render(); return;
  }
  API=await window.claude.use("artifact");
  if(!API){ canWrite=false; setStatus("ro","View only"); render(); return }
  canWrite=true; setStatus("saved","Saved"); render();
  if(merged) queueSave();
})();
}); // Close DOMContentLoaded event listener

</script>
